<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mastanicks API House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rye&family=Spline+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="location-consent" class="location-consent" hidden>
    <div>
      <p class="name">Local earthquake search</p>
      <p class="meta">Allow location to save approximate coordinates in a cookie for nearby USGS results.</p>
    </div>
    <div class="consent-actions">
      <button id="location-allow" type="button">Allow Location</button>
      <button id="location-skip" type="button" class="secondary-button">Not Now</button>
    </div>
  </div>

  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Live board</p>
        <h1>Mastanicks API House</h1>
      </div>
      <p id="updated" class="updated">Syncing data</p>
    </header>

    <section class="grid" aria-label="Market and sports dashboard">
      <article class="panel market-panel">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Crypto</p>
            <h2>Market Watch</h2>
          </div>
          <span id="crypto-status" class="status">Loading</span>
        </div>
        <div id="crypto-list" class="stack"></div>
      </article>

      <article class="panel sports-panel">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Sports</p>
            <h2>Scoreboard</h2>
          </div>
          <span id="sports-status" class="status">Loading</span>
        </div>
        <div id="sports-list" class="stack"></div>
      </article>
    </section>

    <section class="forum-panel panel" aria-label="House forum">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">House Forum</p>
          <h2>Post From The Rail</h2>
        </div>
        <span id="forum-status" class="status">Connecting</span>
      </div>

      <form id="forum-form" class="forum-form">
        <label>
          <span>Name</span>
          <input id="forum-name" name="name" type="text" maxlength="32" autocomplete="nickname" placeholder="Table name" required>
        </label>
        <label>
          <span>Message</span>
          <textarea id="forum-message" name="message" maxlength="420" rows="3" placeholder="Drop a pick, note, or hot take" required></textarea>
        </label>
        <button type="submit">Post</button>
      </form>

      <div id="forum-list" class="forum-list"></div>
    </section>

    <section class="quake-panel panel" aria-label="USGS earthquake search">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">USGS Search</p>
          <h2>Earthquake Table</h2>
        </div>
        <span id="quake-status" class="status">Ready</span>
      </div>

      <form id="quake-form" class="quake-form">
        <label>
          <span>Window</span>
          <select id="quake-days" name="days">
            <option value="1">Past 24 hours</option>
            <option value="7" selected>Past 7 days</option>
            <option value="30">Past 30 days</option>
          </select>
        </label>
        <label>
          <span>Min mag</span>
          <input id="quake-minmag" name="minmagnitude" type="number" min="0" max="10" step="0.1" value="4.5">
        </label>
        <label>
          <span>Order</span>
          <select id="quake-order" name="orderby">
            <option value="time">Newest</option>
            <option value="magnitude">Largest</option>
          </select>
        </label>
        <label>
          <span>Latitude</span>
          <input id="quake-latitude" name="latitude" type="number" min="-90" max="90" step="0.0001" placeholder="Optional">
        </label>
        <label>
          <span>Longitude</span>
          <input id="quake-longitude" name="longitude" type="number" min="-180" max="180" step="0.0001" placeholder="Optional">
        </label>
        <label>
          <span>Radius km</span>
          <input id="quake-radius" name="maxradiuskm" type="number" min="1" max="20001.6" step="1" value="500">
        </label>
        <button id="quake-locate" type="button" class="secondary-button">Use My Location</button>
        <button type="submit">Search</button>
      </form>

      <div id="quake-list" class="quake-list"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
